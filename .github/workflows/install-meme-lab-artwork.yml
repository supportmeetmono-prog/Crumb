name: Install official CRUMB Meme Lab artwork
on:
  push:
    branches: [meme-lab-official-downloads-20261022]
    paths:
      - 'CRUMB_Meme_Lab_4_Original_Images.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-artwork:
    if: github.ref == 'refs/heads/meme-lab-official-downloads-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract four original PNG files
        run: |
          set -euo pipefail
          test -s CRUMB_Meme_Lab_4_Original_Images.zip
          mkdir -p assets/meme-gallery
          for n in 01 02 03 04; do
            path="assets/meme-gallery/crumb-message-${n}.png"
            unzip -p CRUMB_Meme_Lab_4_Original_Images.zip "$path" > "$path"
            test "$(wc -c < "$path")" -gt 100000
            test "$(head -c 8 "$path" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          done
          rm CRUMB_Meme_Lab_4_Original_Images.zip
      - name: Commit verified original gallery files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meme-gallery/crumb-message-*.png
          git add -u CRUMB_Meme_Lab_4_Original_Images.zip
          git commit -m "assets: install four original CRUMB gallery PNGs"
          git push
